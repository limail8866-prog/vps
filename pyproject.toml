[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vps-tracker"
version = "0.1.0"
description = "每日 VPS 促销套餐人民币月均价排行"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
vps-tracker = "vps_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vps_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
