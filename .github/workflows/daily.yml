name: VPS daily ranking

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: vps-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --frozen --extra dev --python 3.11
      - uses: actions/cache@v4
        with:
          path: data/fx-cache.json
          key: fx-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fx-
      - name: Offline tests and lint
        run: |
          uv run --frozen --extra dev pytest
          uv run --frozen --extra dev ruff check .
          uv run --frozen --extra dev ruff format --check .
      - name: Fetch and report
        id: crawl
        continue-on-error: true
        run: uv run --frozen --extra dev python -m vps_tracker run
      - name: Create deduplicated low-price issues
        if: ${{ steps.crawl.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen --extra dev python -m vps_tracker alerts --repository "${{ github.repository }}"
      - name: Commit reports, including failure diagnostics
        if: ${{ always() && steps.crawl.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/*.md data/latest.json data/history/*.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update daily VPS ranking"
            git push
          fi
      - name: Mark a completely failed crawl
        if: ${{ always() && steps.crawl.outcome == 'failure' }}
        run: exit 1
